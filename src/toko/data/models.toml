# OpenAI. tiktoken already knows most OpenAI models and toko defers to it;
# these are the ones it does not cover.
#
# tiktoken cannot map dotted OpenAI names to a tokenizer at all, and its prefix
# table only grows on release. Naming an encoding here marks it as verified, so
# counting stays exact and warning-free; anything absent is estimated with
# o200k_base and says so on stderr.
#
# `listed` controls whether --list-models advertises the model on top of
# tiktoken's own table.

[[model]]
name = "gpt-4.1-mini"
provider = "openai"

[[model]]
name = "gpt-4.1-nano"
provider = "openai"

[[model]]
name = "gpt-5-mini"
provider = "openai"

[[model]]
name = "gpt-5-nano"
provider = "openai"

[[model]]
name = "gpt-5.1"
provider = "openai"
encoding = "o200k_base"

[[model]]
name = "gpt-5.2"
provider = "openai"
encoding = "o200k_base"

[[model]]
name = "gpt-5.2-pro"
provider = "openai"
encoding = "o200k_base"

# Not listed: genai-prices has no entry for it, so toko cannot cost it.
[[model]]
name = "gpt-5.1-pro"
provider = "openai"
encoding = "o200k_base"
listed = false
