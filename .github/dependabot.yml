version: 2

updates:
  # Only the actions: the Python dependency ranges are hand-reasoned (see the
  # genai-prices upper bound in pyproject.toml) and are not on an automated bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Routine bumps arrive as one PR; a major (checkout v6, say) comes on its own,
    # since a grouped PR can't be partially merged.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"
