name: Release

on:
  push:
    tags:
      - "[0-9]*"

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Environment and permissions trusted publishing.
    environment:
      # Create this environment in the GitHub repository under Settings -> Environments
      name: pypi
    permissions:
      id-token: write
      contents: read

    env:
      # Both [all] steps load the same Hugging Face tokenizer. Without this they each
      # get a fresh temp cache and download it again, doubling the anonymous Hub
      # traffic in the one job that treats a 429 as a skip. huggingface_hub reads
      # XDG_CACHE_HOME, and so does the smoke test, whose setdefault leaves this in
      # place; its own clear-cache dispatch only ever removes toko's own files.
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Build
        run: uv build
      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with "$(ls dist/*.whl)[all]" tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with "$(ls dist/*.tar.gz)[all]" tests/smoke_test.py
      - name: Publish
        run: uv publish
