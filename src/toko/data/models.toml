# xAI. The API is OpenAI-compatible but ships no tokenizer, so counts are
# estimated with o200k_base.
#
# xAI retired eight slugs on 2026-05-15 but kept them resolving: the API
# answers with a different model instead of 404ing, so a count taken under a
# retired name silently belongs to whatever now serves it. redirects_to
# records that.

[[model]]
name = "grok-4.5"
provider = "xai"
encoding = "o200k_base"

[[model]]
name = "grok-4.3"
provider = "xai"
encoding = "o200k_base"

[[model]]
name = "grok-4.20-0309-reasoning"
provider = "xai"
encoding = "o200k_base"

[[model]]
name = "grok-4.20-0309-non-reasoning"
provider = "xai"
encoding = "o200k_base"

[[model]]
name = "grok-4.20-multi-agent-0309"
provider = "xai"
encoding = "o200k_base"

[[model]]
name = "grok-build-0.1"
provider = "xai"
encoding = "o200k_base"

# "<modelname> is aliased to the latest stable version. <modelname>-latest is
# aliased to the latest version." (https://docs.x.ai/developers/models). The last
# stable Grok 4 was grok-4-0709, so grok-4 inherits its retirement rather than
# restating it as if xAI had listed grok-4 itself.
[[model]]
name = "grok-4-0709"
provider = "xai"
encoding = "o200k_base"
retired = "2026-05-15"
redirects_to = "grok-4.3"
aliases = ["grok-4", "grok-4-latest"]

[[model]]
