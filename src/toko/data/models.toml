encoding = "o200k_base"
retired = "2026-05-15"
redirects_to = "grok-4.3"

[[model]]
name = "grok-4-1-fast-non-reasoning"
provider = "xai"
encoding = "o200k_base"
retired = "2026-05-15"
redirects_to = "grok-4.3"

[[model]]
