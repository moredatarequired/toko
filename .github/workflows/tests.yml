name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Without these, tiktoken and Hugging Face cache into a tempdir and every
      # run re-downloads ~118 MB of encodings and tokenizers.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      # The runner image can lag the distro's ca-certificates, and checkout's git
      # reads this store.
      - name: Update the runner's CA store
        run: sudo apt-get update -q && sudo apt-get install -y -q --only-upgrade ca-certificates

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The pinned action's bundled hash table only covers versions that release
          # knew about, and 0.13.5 is not one of them, so without this checksum the
          # download goes unverified: one debug line, green build. This step is duplicated in
          # git-hooks-checks.yml and release.yml: the action SHA, the version and
          # the checksum have to match across all three. Dependabot bumps the
          # action SHA and nothing else, so the other two are hand-maintained.
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f" # pragma: allowlist secret
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (all groups)
        run: uv sync --all-groups --all-extras

      # Fails if the runner's TLS clients, uv, or the locked certifi still accept a
      # certificate from the compromised eMudhra intermediates. An intercepting
      # proxy turns every line INCONCLUSIVE, which passes.
      - name: Probe trust stores for the eMudhra CA compromise
        run: |
          uv run sh scripts/emudhra/probe_runtime.sh > probe.txt
          sh scripts/emudhra/probe_package_managers.sh >> probe.txt
          cat probe.txt
          # The runner image's own node and system pip are not used by this job.
          if grep -E '^VULNERABLE' probe.txt | grep -vE '^VULNERABLE +(node|npm|python3 -m pip) '; then exit 1; fi
          if grep -qE '^VULNERABLE +(node|npm|python3 -m pip) ' probe.txt; then
            echo "::warning::the runner image's node or system pip trusts the compromised eMudhra intermediates"
          fi
        env:
          UV_NO_SYNC: "1"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Keyed on a manual version suffix, not on uv.lock: the tokenizers are
      # pinned by model id in the tests, not by any dependency. actions/cache
      # skips the save on an exact key hit, so bump the suffix when a test
      # starts pulling a tokenizer that isn't in the cache yet.
      - name: Cache tokenizer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cache/tiktoken
            ${{ github.workspace }}/.cache/huggingface
          key: tokenizers-${{ runner.os }}-v1
          restore-keys: tokenizers-${{ runner.os }}-

      # Tests that need API keys skip cleanly, so no secrets are required.
      - name: Run tests
        run: just test-all
        env:
          UV_NO_SYNC: "1"
