name: Release

on:
  push:
    tags:
      - "[0-9]*"

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Environment and permissions trusted publishing.
    environment:
      # Create this environment in the GitHub repository under Settings -> Environments
      name: pypi
    permissions:
      id-token: write
      contents: read

    env:
      # Both [all] steps load the same Hugging Face tokenizer. Without this they each
      # get a fresh temp cache and download it again, doubling the anonymous Hub
      # traffic in the one job that treats a 429 as a skip. huggingface_hub reads
      # XDG_CACHE_HOME, and so does the smoke test, whose setdefault leaves this in
      # place; its own clear-cache dispatch only ever removes toko's own files.
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache

    steps:
      # The runner image can lag the distro's ca-certificates, and checkout's git
      # reads this store.
      - name: Update the runner's CA store
        run: sudo apt-get update -q && sudo apt-get install -y -q --only-upgrade ca-certificates
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # See the pinning note in tests.yml; keep these three in sync.
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f" # pragma: allowlist secret
      # Before uv downloads or runs anything in this job, which holds id-token: write.
      - name: Probe uv for the eMudhra CA compromise
        timeout-minutes: 5
        run: |
          ONLY=uv sh scripts/emudhra/probe_package_managers.sh > probe-uv.txt
          cat probe-uv.txt
          sh scripts/emudhra/gate.sh probe-uv.txt uv
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Build
        run: uv build
      # The built wheel's resolved certifi and the OS store must refuse the chains too.
      - name: Probe the wheel's environment for the eMudhra CA compromise
        timeout-minutes: 10
        run: |
          uv run --isolated --no-project --with "$(ls dist/*.whl)" sh scripts/emudhra/probe_runtime.sh > probe.txt
          cat probe.txt
          sh scripts/emudhra/gate.sh probe.txt python-ssl-certifi curl
      # Check that basic features work and we didn't miss to include crucial files.
      # The no-extras install comes first because it is the only one that can catch a
      # dependency toko imports but never declares: [all] pulls transformers, which
      # pulls huggingface-hub, which depends on click, so a re-added direct click
      # import would resolve there no matter what toko declares.
      - name: Smoke test (wheel, no extras)
        run: uv run --isolated --no-project --with "$(ls dist/*.whl)" tests/smoke_test.py
      - name: Smoke test (wheel, all extras)
        run: uv run --isolated --no-project --with "$(ls dist/*.whl)[all]" tests/smoke_test.py
      - name: Smoke test (source distribution, all extras)
        run: uv run --isolated --no-project --with "$(ls dist/*.tar.gz)[all]" tests/smoke_test.py
      - name: Publish
        run: uv publish
