name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Without these, tiktoken and Hugging Face cache into a tempdir and every
      # run re-downloads ~118 MB of encodings and tokenizers.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Exact, so setup-uv installs it without asking the GitHub releases API
          # which version "latest" is. v6 has no built-in hash for 0.12.3 and skips
          # verification silently without an explicit checksum. This step is
          # duplicated in git-hooks-checks.yml and release.yml: the action SHA, the
          # version and the checksum have to match across all three. Dependabot
          # bumps the action SHA and nothing else, so the version and checksum are
          # hand-maintained.
          version: "0.12.3"
          checksum: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101" # pragma: allowlist secret
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (all groups)
        run: uv sync --all-groups --all-extras

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Keyed on a manual version suffix, not on uv.lock: the tokenizers are
      # pinned by model id in the tests, not by any dependency. actions/cache
      # skips the save on an exact key hit, so bump the suffix when a test
      # starts pulling a tokenizer that isn't in the cache yet.
      - name: Cache tokenizer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cache/tiktoken
            ${{ github.workspace }}/.cache/huggingface
          key: tokenizers-${{ runner.os }}-v1
          restore-keys: tokenizers-${{ runner.os }}-

      # Tests that need API keys skip cleanly, so no secrets are required.
      - name: Run tests
        run: just test-all
        env:
          UV_NO_SYNC: "1"
