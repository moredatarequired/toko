name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      # Without these, tiktoken and Hugging Face cache into a tempdir and every
      # run re-downloads ~118 MB of encodings and tokenizers.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # No .python-version is committed, so pin the interpreter here.
      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies (all groups)
        run: uv sync --all-groups --all-extras

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Cache tokenizer downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/tiktoken
            ${{ github.workspace }}/.cache/huggingface
          key: tokenizers-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: tokenizers-${{ runner.os }}-

      # Tests that need API keys skip cleanly, so no secrets are required.
      - name: Run tests
        run: just test-all
        env:
          UV_NO_SYNC: "1"
