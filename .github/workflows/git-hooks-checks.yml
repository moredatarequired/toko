name: Code Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          # See the pinning note in tests.yml; keep these three in sync.
          version: "0.12.3"
          checksum: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101" # pragma: allowlist secret
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (all groups)
        run: uv sync --all-groups --all-extras

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Run Commit Checks
        run: uv run --group dev lefthook run pre-commit --all-files --no-tty
        env:
          UV_NO_SYNC: "1"
          LEFTHOOK_OUTPUT: "summary,success,failure,execution,execution_out"
