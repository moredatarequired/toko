name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Without these, tiktoken and Hugging Face cache into a tempdir and every
      # run re-downloads ~118 MB of encodings and tokenizers.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The checksum is redundant today - the pinned action bundles a hash for
          # 0.12.3 - but that table only covers versions the pinned release knew
          # about, so raising the version alone would drop verification silently:
          # one debug line, green build. This step is duplicated in
          # git-hooks-checks.yml and release.yml: the action SHA, the version and
          # the checksum have to match across all three. Dependabot bumps the
          # action SHA and nothing else, so the other two are hand-maintained.
          version: "0.12.3"
          checksum: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101" # pragma: allowlist secret
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (all groups)
        run: uv sync --all-groups --all-extras

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Keyed on a manual version suffix, not on uv.lock: the tokenizers are
      # pinned by model id in the tests, not by any dependency. actions/cache
      # skips the save on an exact key hit, so bump the suffix when a test
      # starts pulling a tokenizer that isn't in the cache yet.
      - name: Cache tokenizer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cache/tiktoken
            ${{ github.workspace }}/.cache/huggingface
          key: tokenizers-${{ runner.os }}-v1
          restore-keys: tokenizers-${{ runner.os }}-

      # Pinned, not `apt-get install ripgrep`: the parity tests compare toko's
      # discovery against one specific ripgrep's semantics, and Ubuntu's package
      # lags far enough behind that it would quietly compare against another.
      - name: Install ripgrep
        env:
          RG_VERSION: "14.1.0"
          RG_SHA256: "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7" # pragma: allowlist secret
        run: |
          set -euo pipefail
          archive="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${archive}"
          echo "${RG_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" --strip-components=1 \
            "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg"
          sudo install -m 0755 rg /usr/local/bin/rg
          rm -f "$archive" rg
          rg --version

      # Tests that need API keys skip cleanly, so no secrets are required. The two
      # TOKO_REQUIRE_* variables are not those: ripgrep is installed above and this
      # runner's locale does move off UTF-8, so a skip of either suite would be a
      # green build that checked nothing. Both raise instead of skipping.
      - name: Run tests
        run: just test-all
        env:
          UV_NO_SYNC: "1"
          TOKO_REQUIRE_RG: "1"
          TOKO_REQUIRE_NON_UTF8_LOCALE: "1"
