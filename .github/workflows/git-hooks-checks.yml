name: Code Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      # The runner image can lag the distro's ca-certificates, and checkout's git
      # reads this store.
      - name: Update the runner's CA store
        run: sudo apt-get update -q && sudo apt-get install -y -q --only-upgrade ca-certificates

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # See the pinning note in tests.yml; keep these three in sync.
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f" # pragma: allowlist secret
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (all groups)
        run: uv sync --all-groups --all-extras

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run Commit Checks
        run: uv run --group dev lefthook run pre-commit --all-files --no-tty
        env:
          UV_NO_SYNC: "1"
          LEFTHOOK_OUTPUT: "summary,success,failure,execution,execution_out"
