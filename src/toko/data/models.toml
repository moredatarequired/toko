# toko's model registry.
#
# Adding a model is a data edit, not a code change: append a [[model]] entry
# here, or to ~/.config/toko/models.toml to add one without reinstalling toko.
# Entries in the user file merge over these field by field.
#
# Fields: name (required), provider (required), encoding, api_endpoint,
# retired, redirects_to, tokenizer, listed.

# Anthropic (API-based counting).
#
# Anthropic replaced its tokenizer at Claude Opus 4.7: the same text produces
# roughly 30% more tokens on 4.7-generation models than on everything before
# them. `tokenizer` records which generation a model belongs to, because the
# boundary is not inferable from the version number -- Sonnet 4.6 is on the old
# tokenizer while Sonnet 5 is on the new one. Alias resolution refuses to cross
# it, so this field must be set on every Anthropic model.

[[model]]
name = "claude-fable-5"
provider = "anthropic"
tokenizer = "claude-opus-4-7"

[[model]]
name = "claude-opus-5"
provider = "anthropic"
tokenizer = "claude-opus-4-7"

